site_name: Extensão de Fact-Checking para YouTube
site_description: Documentação técnica e de produto — checagem de fatos em vídeos via transcrição + IA
site_url: https://evidencia-grupo.github.io/documentation/
repo_url: https://github.com/evidencia-grupo/documentation
repo_name: evidencia-grupo/documentation
docs_dir: docs

theme:
  name: material
  language: pt
  palette:
    # Esquema Claro (detectado automaticamente quando o SO estiver no modo claro)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Alternar para tema escuro
    # Esquema Escuro (detectado automaticamente quando o SO estiver no modo escuro)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-night
        name: Alternar para tema claro
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.keys

nav:
  - Início: index.md
  - Visão:
      - Alinhamento Estratégico: visao/alinhamento-estrategico.md
  - Design e Experiência:
      - Personas e Jornadas: design/personas-e-jornadas.md
      - Design System e Interface: design/design-system.md
  - Engenharia de Requisitos:
      - Processo e Técnicas de Elicitação: requisitos/elicitacao.md
      - Catálogo de Requisitos (RF e RNF): requisitos/catalogo-requisitos.md
      - Casos de Uso: requisitos/casos-de-uso.md
      - Cenários de Uso e Operação: requisitos/cenarios.md
      - Backlog e Histórias de Usuário: requisitos/backlog-e-historias.md
      - Matriz de Rastreabilidade: requisitos/matriz-rastreabilidade.md
  - Arquitetura e Engenharia:
      - Arquitetura do Sistema: tecnico/arquitetura.md
      - Pipeline de IA e Datasets: tecnico/ia-e-datasets.md
      - Contrato de Dados e API: tecnico/contrato-api.md
      - Threat Model e LGPD: tecnico/threat-model.md
      - Estratégia de Testes e DoD: tecnico/estrategia-testes.md
      - Evidências de Validação (HU03): tecnico/evidencias/hu03-checagem-rapida.md
      - Evidências de Validação (HU06): tecnico/evidencias/hu06-cache-local.md
      - Guia de Contribuição e Setup: tecnico/guia-contribuicao.md
      - Decisões Arquiteturais (ADRs):
          - ADR-001 — Manifest V3: tecnico/decisoes/ADR-001-manifest-v3.md
          - ADR-002 — Backend Proxy Dedicado: tecnico/decisoes/ADR-002-backend-proxy.md
          - ADR-003 — Estratégia de Cache Local: tecnico/decisoes/ADR-003-estrategia-cache-local.md
          - ADR-004 — Definição da Stack Tecnológica: tecnico/decisoes/ADR-004-stack-tecnologica.md
          - ADR-005 — Modelo Local e Datasets Brasileiros: tecnico/decisoes/ADR-005-modelo-local-e-datasets-brasileiros.md
  - Planejamento e Governança:
      - Priorização e MVP: planejamento/priorizacao-e-mvp.md
      - Gestão de Riscos Técnicos: planejamento/gestao-riscos.md
      - Instrumentação e Telemetria: planejamento/metricas-telemetria.md
  - Referência:
      - Glossário Técnico: referencia/glossario.md
