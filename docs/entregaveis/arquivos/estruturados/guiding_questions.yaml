date: '2026-10-09'
scope: desenvolvimento local
records:
- '#': GQ01
  Guiding Question: O que torna uma informação de vídeo difícil de avaliar?
  Resposta Sintetizada: Mistura de opinião, contexto temporal, linguagem emocional
    e múltiplas alegações simultâneas.
  Decisão Derivada: Decompor o conteúdo em alegações verificáveis antes de qualquer
    análise.
- '#': GQ02
  Guiding Question: O usuário precisa de um "veredito" ou de evidências para investigar?
  Resposta Sintetizada: Evidências, contexto e incertezas preservam a autonomia crítica;
    um veredito único a elimina.
  Decisão Derivada: Remover o score global (0–100) e o gauge da UX principal.
- '#': GQ03
  Guiding Question: O que a IA pode automatizar sem substituir o julgamento?
  Resposta Sintetizada: Extração de alegações, recuperação, agrupamento, comparação
    e síntese explicativa.
  Decisão Derivada: A LLM não é autoridade factual primária; serve como componente
    auxiliar de linguagem.
- '#': GQ04
  Guiding Question: Que evidência é relevante para português brasileiro?
  Resposta Sintetizada: Registros de fact-checking e corpora brasileiros; bases genéricas
    não cobrem o contexto PT-BR adequadamente.
  Decisão Derivada: Usar FactChecks.br para evidências; Fake.br apenas como corpus
    de linguagem, sem tratá-lo como base factual.
- '#': GQ05
  Guiding Question: O que significa "não encontramos evidência"?
  Resposta Sintetizada: Ausência de evidência não equivale a falsidade; é um estado
    epistêmico distinto.
  Decisão Derivada: Criar estado explícito insufficient_evidence distinto de false.
- '#': GQ06
  Guiding Question: Como lidar com fontes conflitantes?
  Resposta Sintetizada: Expor a divergência com data e contexto das fontes; nunca
    reduzir conflito a uma nota arbitrária.
  Decisão Derivada: Painel apresenta ambos os lados de controvérsias legítimas sem
    arbitrar vencedor.
- '#': GQ07
  Guiding Question: Como evitar que a LLM alucine uma checagem?
  Resposta Sintetizada: Toda conclusão factual depende de evidências recuperadas e
    rastreáveis; a LLM não deve inventar fatos.
  Decisão Derivada: RAG é o núcleo factual; a LLM é componente auxiliar de linguagem
    e formulação.
- '#': GQ08
  Guiding Question: Como o usuário exerce pensamento crítico?
  Resposta Sintetizada: O painel apresenta perguntas reflexivas (fonte? data? o que
    foi omitido? que evidência contradiz?).
  Decisão Derivada: HU11 promovida de Pós-MVP para Must Have do MVP.
- '#': GQ09
  Guiding Question: Como medir se a recuperação funciona?
  Resposta Sintetizada: Recall@k, MRR, nDCG e análise qualitativa dos top-k resultados.
  Decisão Derivada: A EDA inclui avaliação de retrieval com métricas objetivas.
- '#': GQ10
  Guiding Question: Como lidar com conteúdo antigo?
  Resposta Sintetizada: A alegação deve ser interpretada no contexto temporal original
    de publicação.
  Decisão Derivada: Manter campo TemporalContext no schema de alegações.
- '#': GQ11
  Guiding Question: Qual é o papel do usuário?
  Resposta Sintetizada: Investigador final, não receptor passivo de um veredito algorítmico.
  Decisão Derivada: UX orientada à investigação assistida; o usuário conclui, o sistema
    organiza.
- '#': GQ12
  Guiding Question: Qual é o limite do produto?
  Resposta Sintetizada: Não determina "a verdade"; organiza evidências e explicita
    o grau de suporte disponível.
  Decisão Derivada: Revisar visão, requisitos e nomenclatura para eliminar termos
    como "veracidade" e "score".
