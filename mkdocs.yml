site_name: Extensão de Fact-Checking para YouTube
site_description: Documentação técnica e de produto — checagem de fatos em vídeos via transcrição + IA
site_url: https://evidencia-grupo.github.io/documentation/
repo_url: https://github.com/evidencia-grupo/documentation
repo_name: evidencia-grupo/documentation
docs_dir: docs

theme:
  name: material
  language: pt
  palette:
    # Esquema Claro (detectado automaticamente quando o SO estiver no modo claro)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Alternar para tema escuro
    # Esquema Escuro (detectado automaticamente quando o SO estiver no modo escuro)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-night
        name: Alternar para tema claro
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.keys

nav:
  - Visão Geral:
      - Apresentação: index.md
      - Síntese Executiva (1 Página): visao-geral/visao-geral-do-projeto.md
      - Topologia & Mapa Visual: visao-geral/mapa-do-projeto.md
      - Painel de Status Consolidado: visao-geral/status.md
      - Glossário Oficial Unificado: glossario.md
  - Requisitos:
      - Visão de Produto & UX:
          - Alinhamento Estratégico: visao/alinhamento-estrategico.md
          - Personas e Jornadas: design/personas-e-jornadas.md
          - Design System e Interface: design/design-system.md
      - Especificação de Requisitos:
          - Processo de Elicitação ($100): requisitos/elicitacao.md
          - Catálogo de Requisitos (RF e RNF): requisitos/catalogo-requisitos.md
          - Casos de Uso e Diagramas: requisitos/casos-de-uso.md
          - Cenários de Uso e Operação: requisitos/cenarios.md
          - Backlog e Histórias (HUs): requisitos/backlog-e-historias.md
          - Matriz de Rastreabilidade (MoSCoW): requisitos/matriz-rastreabilidade.md
          - Priorização e Riscos: planejamento/priorizacao-e-mvp.md
  - Arquitetura:
      - Sistema & Engenharia:
          - Arquitetura do Sistema (C4): tecnico/arquitetura.md
          - Pipeline de IA e Datasets: tecnico/ia-e-datasets.md
          - Contrato de Dados e API: tecnico/contrato-api.md
          - Threat Model (STRIDE) e LGPD: tecnico/threat-model.md
          - Estratégia de Testes e CI/CD: tecnico/estrategia-testes.md
          - Instrumentação e Telemetria: planejamento/metricas-telemetria.md
          - Guia de Contribuição e Setup: tecnico/guia-contribuicao.md
      - Decisões de Arquitetura (ADRs):
          - ADR-001 — Manifest V3: tecnico/decisoes/ADR-001-manifest-v3.md
          - ADR-002 — Backend Proxy Dedicado: tecnico/decisoes/ADR-002-backend-proxy.md
          - ADR-003 — Estratégia de Cache Local: tecnico/decisoes/ADR-003-estrategia-cache-local.md
          - ADR-004 — Definição da Stack Tecnológica: tecnico/decisoes/ADR-004-stack-tecnologica.md
          - ADR-005 — Modelo Local e Datasets Brasileiros: tecnico/decisoes/ADR-005-modelo-local-e-datasets-brasileiros.md
          - ADR-006 — Arquitetura Evidence-First: tecnico/decisoes/ADR-006-evidence-first-architecture.md
  - Validação:
      - Experimento com Usuários:
          - Plano do Experimento: cbl/act/experiment-plan.md
          - Protocolo do Participante: cbl/act/participant-protocol.md
          - Métricas de Validação (M1 a M9): cbl/act/metrics-definition.md
          - Especificação de Telemetria: cbl/act/telemetry-spec.md
          - Limitações do Estudo: cbl/act/limitations.md
      - Qualidade & Metodologia:
          - Critérios de Entrega (DoD): scrum/definition-of-done.md
          - Backlog do Produto: scrum/product-backlog.md
          - Questões Norteadoras: visao/guiding-questions.md
          - Avaliação e Reflexão Crítica: cbl/reflect-share/reflection.md



