$schema: "http://json-schema.org/draft-07/schema#"
title: EvidenciaAuditFinding
type: object
required:
  - id
  - titulo
  - dominio
  - repo_alvo
  - componente
  - severidade
  - prioridade
  - verificacao
  - confianca
  - evidencia
  - impacto
  - causa_raiz
  - correcao
  - criterios_aceitacao
properties:
  id:
    type: string
    pattern: "^(SEC|ARCH|EXT|API|AI|DATA|PRIV|A11Y|TEST|CI|DEP|DOC)-[0-9]{3}$"
  titulo:
    type: string
  dominio:
    enum: [SEC, ARCH, EXT, API, AI, DATA, PRIV, A11Y, TEST, CI, DEP, DOC]
  repo_alvo:
    enum: [EvidencIA, documentation]
  componente:
    enum: [extensao, backend, shared, ci, docs, dados]
  severidade:
    enum: [CRITICAL, HIGH, MEDIUM, LOW, INFO]
  prioridade:
    enum: [P0, P1, P2, P3] # P0=Bloqueador, P1=Alta, P2=Média, P3=Evolução
  verificacao:
    enum: [CONFIRMED, STATIC, SUSPECTED]
  confianca:
    enum: [alta, media, baixa]
  fronteira_de_confianca:
    type: string
    description: "Ator de origem e fronteira cruzada (obrigatório em SEC, PRIV e AI)"
  referencias:
    type: array
    items: { type: string } # Ex: ["CWE-79", "OWASP-LLM-01"]
  evidencia:
    type: array
    items:
      type: object
      required: [permalink, trecho]
      properties:
        permalink: { type: string }
        trecho: { type: string }
  reproducao:
    type: string
    description: "Comandos exatos para reproduzir ou justificativa estática"
  observado:
    type: string
  esperado:
    type: string
  impacto:
    type: string
  causa_raiz:
    type: string
  root_cause_id:
    type: string
    description: "Identificador compartilhado caso múltiplos achados derivem do mesmo erro"
  mitigacoes_verificadas:
    type: array
    items: { type: string }
  correcao:
    type: string
    description: "Menor alteração necessária para resolver o problema"
  alternativa_estrutural:
    type: string
  arquivos_afetados:
    type: array
    items: { type: string }
  criterios_aceitacao:
    type: array
    items: { type: string }
  depende_de:
    type: array
    items: { type: string }
  bloqueia_estagio:
    type: array
    items:
      enum: [desenvolvimento, avaliacao_interna, experimento_usuarios, producao]
  esforco:
    enum: [S, M, L]
  papel:
    enum: [backend, extensao, ia_dados, qa, devops, docs]
